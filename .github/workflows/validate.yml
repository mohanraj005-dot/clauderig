name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate manifests, hooks, skills and README paths
        run: python3 scripts/validate.py
      - name: Lint the bundled example floor plan
        run: python3 sketcher/skills/sketcher/scripts/lint_plan.py sketcher/skills/sketcher/assets/presets/example-cafe.json
